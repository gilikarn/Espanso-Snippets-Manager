version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    ignore:
      # js-yaml is bundled into the page; a new major changes YAML output and needs a careful, tested migration.
      - dependency-name: js-yaml
        update-types: ["version-update:semver-major"]
