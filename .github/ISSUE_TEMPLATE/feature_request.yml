name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe what you're trying to achieve. The goal matters more than a specific solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Ideas for how it could work (optional)
